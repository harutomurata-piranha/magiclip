# Render デプロイ設定（MagiClip）
# ffmpegと日本語フォントが必要なため Docker ランタイムを使用（Dockerfile を参照）
services:
  - type: web
    name: magiclip
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore        # 日本から最も近いリージョン
    plan: standard           # 2GB/1CPU。動画処理(ffmpeg)＋字幕生成に512MBでは足りずOOMするため必須。
                             # デモ後にコストを下げるなら free に戻す（ただし重い処理は落ちる）
    healthCheckPath: /healthz   # パスワードゲートで/が401になるため、AI呼び出しなしで200を返す専用パスを使う
    envVars:
      - key: OPENAI_API_KEY      # Whisper（文字起こし）用。Renderダッシュボードで値を設定
        sync: false
      - key: ANTHROPIC_API_KEY   # Claude（構成・校正）用。Renderダッシュボードで値を設定
        sync: false
