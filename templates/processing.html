{% extends "base.html" %}
{% block title %}処理中 - MagiClip{% endblock %}
{% block content %}
<div class="panelbox">
  <h1>魔法をかけています…</h1>
  <div class="spinner"></div>
  <p class="muted" id="msg">AIが見どころを探しています</p>
</div>
{% endblock %}
{% block scripts %}
<script>
  const jobId = "{{ job.id }}";
  const msgs = ["AIが見どころを探しています", "テンポよくカットしています", "字幕をつけています", "仕上げています"];
  let i = 0;
  setInterval(() => { document.getElementById('msg').textContent = msgs[i++ % msgs.length]; }, 2500);
  async function poll() {
    try {
      const r = await fetch(`/status/${jobId}`);
      const d = await r.json();
      if (d.status === '完成') { location.href = `/result/${jobId}`; return; }
      if (d.status === 'エラー') { document.getElementById('msg').textContent = 'エラーが発生しました。もう一度お試しください。'; return; }
    } catch (e) {}
    setTimeout(poll, 2000);
  }
  poll();
</script>
{% endblock %}
