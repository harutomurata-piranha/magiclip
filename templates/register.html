{% extends "base.html" %}
{% block title %}新規登録 - MagiClip{% endblock %}
{% block body_class %}theme-light{% endblock %}
{% block content %}
<div class="formcard">
  <h2>新規登録</h2>
  <p class="sub">お試しで{{ cfg.FREE_TRIAL_CREDITS }}本まで無料で作成できます。</p>
  <form method="post">
    <label for="email">メールアドレス</label>
    <input type="email" id="email" name="email" required autofocus autocomplete="email">
    <label for="password">パスワード</label>
    <input type="password" id="password" name="password" required autocomplete="new-password">
    <button class="btn" type="submit">無料で始める</button>
  </form>
  <div class="altlink">アカウントをお持ちですか？ <a href="{{ url_for('login') }}">ログイン</a></div>
</div>
{% endblock %}
