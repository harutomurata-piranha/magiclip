{% extends "base.html" %}
{% block title %}完成 - MagiClip{% endblock %}
{% block content %}
<div class="panelbox">
  <h1>完成しました 🎉</h1>
  <p class="muted">プレビューを確認して、ダウンロードしてください。</p>
  <video src="{{ url_for('video', job_id=job.id) }}" controls autoplay muted playsinline></video>
  <div class="center" style="margin-top:14px">
    <a class="btn" href="{{ url_for('download', job_id=job.id) }}">⬇️ ダウンロード</a>
    {% if job.mode == 'pro' %}
      <a class="btn btn-ghost" href="{{ url_for('edit', job_id=job.id) }}">✨ テキストで編集</a>
    {% endif %}
    <a class="btn btn-ghost" href="{{ url_for('upload') }}">もう1本作る</a>
  </div>
  {% if job.mode == 'pro' %}<p class="muted" style="font-size:13px">プロ編集：字幕を直すだけ。不要な行を消すと映像も自動でカットされます。</p>{% endif %}
</div>
<p class="center"><a class="muted" href="{{ url_for('mypage') }}">← マイページに戻る</a></p>
{% endblock %}
